// Indian digit grouping for INR (e.g., 152200 -> 1,52,200)
function formatINR(n, opts = {}) {
  const {
    sign = false,
    unit = true
  } = opts;
  if (n == null || isNaN(n)) return '—';
  const abs = Math.abs(Math.round(n));
  // Group: last 3 digits, then groups of 2
  const s = String(abs);
  let out;
  if (s.length <= 3) {
    out = s;
  } else {
    const last3 = s.slice(-3);
    const rest = s.slice(0, -3);
    const grouped = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
    out = grouped + ',' + last3;
  }
  const prefix = '';
  if (n < 0) return '−' + prefix + out;
  if (sign && n > 0) return '+' + prefix + out;
  return prefix + out;
}
function formatPct(n) {
  if (n == null || isNaN(n)) return '—';
  return Math.round(n * 100) + '%';
}
function initials(name) {
  return name.split(/\s+/).map(p => p[0]).join('').slice(0, 2).toUpperCase();
}
Object.assign(window, {
  formatINR,
  formatPct,
  initials
});

(function(){
// Compute all derived stats from sessions data
window.PLAYERS = ["Vivek P", "Sunny", "Nirav", "Sameer", "Amish", "Nimesh", "Sagar", "Manish"];
var PLAYERS = window.PLAYERS;
function computeAll(sessions) {
  const perPlayer = {};
  for (const name of PLAYERS) {
    perPlayer[name] = {
      name,
      net: 0,
      gamesPlayed: 0,
      wins: 0,
      losses: 0,
      biggestWin: {
        amount: null,
        session: null
      },
      biggestLoss: {
        amount: null,
        session: null
      },
      cumulative: [],
      // [{ sessionIdx, dateLabel, dateISO, net, cumul }]
      last5: [],
      // recent sessions where they played: signs '+'/'-'
      sessions: [],
      // all sessions they played in order
      longestWinStreak: 0,
      longestLossStreak: 0,
      currentStreak: {
        type: null,
        count: 0

      // type: 'win'|'loss'|null, of most recent
      stdDev: 0

        p.cumulative.push({
          sessionIdx: i,
          dateLabel: s.dateLabel,
          dateISO: s.dateISO,
          net: null,
          cumul: p.net,
          played: false
        });
        continue;
      }

      p.gamesPlayed += 1;
      if (net > 0) p.wins += 1;else if (net < 0) p.losses += 1;
      if (p.biggestWin.amount == null || net > p.biggestWin.amount) {
        p.biggestWin = {
          amount: net,
          session: s
        };
      }
      if (p.biggestLoss.amount == null || net < p.biggestLoss.amount) {
        p.biggestLoss = {
          amount: net,
          session: s
        };
      }
      p.cumulative.push({
        sessionIdx: i,
        dateLabel: s.dateLabel,
        dateISO: s.dateISO,
        net,
        cumul: p.net,
        played: true
      });
      p.sessions.push({
        sessionIdx: i,
        dateLabel: s.dateLabel,
        dateISO: s.dateISO,
        net
      });
    }
  });

  // Win rate, avg/session, streaks, last5, stdDev
  for (const name of PLAYERS) {
    const p = perPlayer[name];
    p.winRate = p.gamesPlayed ? p.wins / p.gamesPlayed : 0;
    p.avgPerSession = p.gamesPlayed ? p.net / p.gamesPlayed : 0;

    // last 5 played sessions, most recent last
    p.last5 = p.sessions.slice(-5).map(x => x.net);

    // streaks over played sessions (chronological)
    let curWin = 0,
      curLoss = 0,
      maxWin = 0,
      maxLoss = 0;
    for (const x of p.sessions) {
      if (x.net > 0) {
        curWin++;
        curLoss = 0;
        maxWin = Math.max(maxWin, curWin);
      } else if (x.net < 0) {

      if (cs.type == null) {

  // Profitability factor & fee-adjusted ranking

  if (status === 'loading') { label = 'Updating'; dotColor = colors.textTertiary; }
  else if (status === 'error') { label = 'Offline'; dotColor = colors.negative; }
  else if (minsAgo == null || minsAgo < 1) { label = 'Just now'; dotColor = colors.positive; }
  else if (minsAgo === 1) { label = '1 min ago'; dotColor = colors.positive; }
  else { label = minsAgo + ' mins ago'; dotColor = colors.positive; }

  return React.createElement('button', {
    onClick: onRetry,
    style: {
      display: 'inline-flex', alignItems: 'center', gap: 6,
      padding: '6px 12px', borderRadius: 100,
      background: colors.chip, border: 'none', cursor: 'pointer',
      fontSize: 12, fontWeight: 500, letterSpacing: -0.1,
      color: colors.textSecondary, fontFamily: 'inherit'
    }
  },
    React.createElement('span', {
      style: {
        width: 7, height: 7, borderRadius: '50%',
        background: dotColor,
        animation: status === 'loading' ? 'pulse 1.4s ease-in-out infinite' : 'none'
      }
    }),
    label
  );
}

function TabBar({ active, setActive, colors }) {
  const tabs = [
    { id: 'league', label: 'League', icon: 'tab_league' },
    { id: 'profile', label: 'Profile', icon: 'tab_profile' },
    { id: 'awards', label: 'Awards', icon: 'tab_awards' }
  ];
  return React.createElement('div', {
    style: {
      position: 'sticky', bottom: 0, left: 0, right: 0,
      paddingBottom: 'max(12px, env(safe-area-inset-bottom))',
      paddingTop: 8,
      background: colors.tabBg,
      backdropFilter: 'blur(24px) saturate(180%)',
      WebkitBackdropFilter: 'blur(24px) saturate(180%)',
      borderTop: `0.5px solid ${colors.tabBorder}`,
      display: 'flex', alignItems: 'stretch', zIndex: 10
    }
  },
    tabs.map(t => {
      const isActive = active === t.id;
      const c = isActive ? colors.accent : colors.tabInactive;
      return React.createElement('button', {
        key: t.id,
        onClick: () => setActive(t.id),
        style: {
          flex: 1, background: 'none', border: 'none',
          display: 'flex', flexDirection: 'column', alignItems: 'center',
          justifyContent: 'center', gap: 3, cursor: 'pointer',
          color: c, padding: '4px 0 2px', userSelect: 'none',
          transition: 'color 160ms ease', fontFamily: 'inherit'
        }
      },
        Icon[t.icon](26, isActive),
        React.createElement('span', {
          style: { fontSize: 10, fontWeight: 500, letterSpacing: 0.1, color: c }
        }, t.label)
      );
    })
  );
}

function LoadingState({ colors }) {
  return React.createElement('div', {
    style: {
      minHeight: '60vh', display: 'flex', alignItems: 'center', justifyContent: 'center',
      flexDirection: 'column', gap: 12, color: colors.textTertiary, fontSize: 14
    }
  },
    React.createElement('div', {
      style: {
        width: 28, height: 28, borderRadius: '50%',
        border: `2.5px solid ${colors.separator}`,
        borderTopColor: colors.text,
        animation: 'spin 0.8s linear infinite'
      }
    }),
    React.createElement('div', null, 'Loading sessions')
  );
}

function ErrorState({ colors, onRetry, message }) {
  return React.createElement('div', {
    style: {
      minHeight: '60vh', display: 'flex', alignItems: 'center', justifyContent: 'center',
      flexDirection: 'column', gap: 14, padding: 24, textAlign: 'center'
    }
  },
    React.createElement('div', { style: { fontSize: 32, opacity: 0.4 } }, '⚠'),
    React.createElement('div', {
      style: { fontSize: 15, color: colors.text, fontWeight: 500, letterSpacing: -0.2 }
    }, 'Could not load data'),
    React.createElement('div', {
      style: { fontSize: 13, color: colors.textTertiary, maxWidth: 280, letterSpacing: -0.1 }
    }, message || 'Check your connection and try again.'),
    React.createElement('button', {
      onClick: onRetry,
      style: {
        marginTop: 4, padding: '10px 20px', borderRadius: 100,
        background: colors.chip, border: 'none', cursor: 'pointer',
        fontSize: 14, fontWeight: 500, color: colors.text, fontFamily: 'inherit'
      }
    }, 'Try again')
  );
}

function App() {
  const [sessions, setSessions] = React.useState(STATIC_SESSIONS);
  const [loadStatus, setLoadStatus] = React.useState('idle');
  const [errorMsg, setErrorMsg] = React.useState(null);
  const [lastUpdated, setLastUpdated] = React.useState(null);
  const [, setTick] = React.useState(0);

  const [theme, setTheme] = React.useState(() => {
    try {
      const saved = localStorage.getItem('pokerTheme');
      if (saved === 'dark' || saved === 'light') return saved;
    } catch (e) {}
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  });

  const [tab, setTab] = React.useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('pokerNav') || 'null');
      if (saved && saved.tab) return saved.tab;
    } catch (e) {}
    return 'league';
  });

  const [selectedName, setSelectedName] = React.useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('pokerNav') || 'null');
      if (saved && saved.playerName) return saved.playerName;
    } catch (e) {}
    return window.PLAYERS[0];
  });

  React.useEffect(() => {
    try { localStorage.setItem('pokerNav', JSON.stringify({ tab, playerName: selectedName })); } catch (e) {}
  }, [tab, selectedName]);

  React.useEffect(() => {
    try { localStorage.setItem('pokerTheme', theme); } catch (e) {}
    document.body.style.background = theme === 'dark' ? '#000' : '#fff';
  }, [theme]);

  // Background fetch: silently tries live CSV and updates only when it returns
  // more sessions than the embedded static data (i.e. new games have been added).
  // Static data always stays visible — no loading/error states shown to the user.
  const fetchData = React.useCallback(async () => {
    try {
      const res = await fetch(CSV_URL + '&t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return;
      const text = await res.text();
      const fetched = parseSessionsFromCSV(text);
      if (fetched.length >= STATIC_SESSIONS.length) {
        setSessions(fetched);
        setLastUpdated(Date.now());
      }
    } catch (e) {
      // Silently ignore — static data already shown
    }
  }, []);

  React.useEffect(() => { fetchData(); }, [fetchData]);

  // Auto-refresh when tab becomes visible again and on interval
  React.useEffect(() => {
    const id = setInterval(fetchData, REFRESH_INTERVAL_MS);
    const onVis = () => { if (document.visibilityState === 'visible') fetchData(); };
    document.addEventListener('visibilitychange', onVis);
    return () => { clearInterval(id); document.removeEventListener('visibilitychange', onVis); };
  }, [fetchData]);

  // Tick every 30s so "X mins ago" label stays accurate
  React.useEffect(() => {
    const id = setInterval(() => setTick(n => n + 1), 30000);
    return () => clearInterval(id);
  }, []);

  const state = React.useMemo(() => sessions ? computeAll(sessions) : null, [sessions]);
  const colors = React.useMemo(() => getColors(theme, 'graphite'), [theme]);
  const accent = colors.accent;

  const goTo = ({ tab: t, playerName }) => {
    if (playerName) setSelectedName(playerName);
    if (t) setTab(t);
    requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: 'smooth' }));
  };

  let content;
  if (!sessions && loadStatus === 'loading') {
    content = React.createElement(LoadingState, { colors });
  } else if (!sessions && loadStatus === 'error') {
    content = React.createElement(ErrorState, { colors, onRetry: fetchData, message: errorMsg });
  } else if (state) {
    if (tab === 'league') content = React.createElement(LeagueScreen, { state, goTo, colors, accent });
    else if (tab === 'profile') content = React.createElement(ProfileScreen, { state, selectedName, setSelectedName, colors, accent });
    else content = React.createElement(AwardsScreen, { state, goTo, colors, accent });
  }

  return React.createElement('div', {
    style: {
      minHeight: '100vh', background: colors.bg, color: colors.text,
      display: 'flex', flexDirection: 'column',
      fontFamily: "Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif"
    }
  },
    // Safe-area-aware top padding, then the top bar with theme toggle + status chip
    React.createElement('div', {
      style: {
        paddingTop: 'max(12px, env(safe-area-inset-top))',
        paddingLeft: 20, paddingRight: 20,
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        gap: 10
      }
    },
      React.createElement(StatusChip, {
        status: loadStatus, lastUpdated, colors, onRetry: fetchData
      }),
      React.createElement(ThemeToggle, {
        theme, colors,
        onToggle: () => setTheme(t => t === 'dark' ? 'light' : 'dark')
      })
    ),
    React.createElement('div', {
      id: 'screen-scroll',
      style: { flex: 1, overflowY: 'auto', overflowX: 'hidden', WebkitOverflowScrolling: 'touch' }
    }, content),
    sessions && React.createElement(TabBar, { active: tab, setActive: setTab, colors })
  );
}

window.App = App;
})();

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(window.App));
  </script>
</body>
</html>
